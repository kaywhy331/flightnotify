name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # CI never carries real credentials, so no live call and no provider
      # quota can be consumed. The live suite is opt-in and stays skipped.
      APP_TIMEZONE: UTC
      APP_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: sqlite:///data/ci.db
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static types
        run: mypy

      - name: Migrations apply to a clean database
        run: |
          rm -f data/ci.db
          flightnotify migrate
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: No model/migration drift
        run: python -m alembic check

      - name: Tests
        run: pytest --cov=flightnotify --cov-report=term-missing

      - name: Live tests stay skipped without opt-in
        # No extra -q here: pytest's addopts already sets it, and -qq would
        # suppress the "N skipped" summary this check reads.
        run: |
          pytest tests/live -rs | tee live-tests.log
          grep -qi "skipped" live-tests.log
          # A passed/failed count means a live test actually executed, which
          # would mean real provider or Telegram calls without opt-in.
          if grep -qiE "[0-9]+ (passed|failed)" live-tests.log; then
            echo "::error::live tests executed without FLIGHTNOTIFY_LIVE_TESTS opt-in"
            exit 1
          fi

      - name: Application starts in the setup-required state
        run: |
          # No SERPAPI_API_KEY / TELEGRAM_BOT_TOKEN in this environment.
          flightnotify serve --port 8123 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/ | grep -q "SERPAPI_API_KEY is not set"
          curl -sf http://127.0.0.1:8123/healthz | grep -q '"status":"ok"'
          kill %1

  worker:
    # The Cloudflare deployment. Everything here runs without Cloudflare
    # credentials: local D1, local workerd, and a deploy dry run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate binding types
        run: npx wrangler types

      - name: Build static assets (generated module, not committed)
        run: npm run build:static

      - name: Static types
        run: npx tsc --noEmit

      - name: Unit tests (domain parity, provider, Telegram)
        run: npx vitest run

      - name: D1 migrations initialise a clean local database
        run: |
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply flightnotify --local
          npx wrangler d1 execute flightnotify --local \
            --command "SELECT value FROM schema_meta WHERE key='schema_version';" \
            | grep -q '"value": "1"'

      - name: Integration tests (D1, Cron, lease recovery, auth)
        run: npx vitest run --config vitest.workers.config.ts

      - name: Production build and deploy dry run
        # Requires no authentication, so a broken bundle fails here rather
        # than during a real cutover.
        run: npx wrangler deploy --dry-run --outdir=dist

      - name: No placeholder or real credentials in the bundle
        run: |
          # The committed config must not carry a real D1 database id, and no
          # secret may be inlined into the deployed script.
          grep -q 'PLACEHOLDER_D1_DATABASE_ID' wrangler.jsonc
          if grep -rniE 'serpapi_api_key["'"'"']?\s*[:=]\s*["'"'"'][a-f0-9]{32}' dist/; then
            echo "::error::a SerpApi-shaped key is present in the built bundle"
            exit 1
          fi
          if grep -rnE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' dist/; then
            echo "::error::a Telegram-bot-token-shaped string is present in the built bundle"
            exit 1
          fi

  golden-vectors:
    # The Worker is a port, not a rewrite. These vectors are generated from the
    # Python implementation and asserted by the Worker suite, so a drift in
    # either one is a build failure rather than a silent behaviour change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate and diff
        run: |
          python -m tests.golden.generate_vectors > /tmp/vectors.json
          if ! diff -u worker/test/golden/vectors.json /tmp/vectors.json; then
            echo "::error::golden vectors are stale; run `make golden` and commit the result"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t flightnotify:ci .
      - name: Container starts and reports health without credentials
        run: |
          docker run -d --name fn -p 127.0.0.1:8124:8000 \
            -e APP_SECRET_KEY=ci-only-not-a-real-secret \
            -e APP_TIMEZONE=UTC \
            flightnotify:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8124/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8124/healthz | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8124/ | grep -q "Setup checklist"
          docker rm -f fn
