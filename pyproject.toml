[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightnotify"
version = "1.0.0"
description = "Single-user round-trip flight price tracker with Telegram alerts and a hard free-tier quota guard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FlightNotify" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "itsdangerous>=2.2,<3.0",
  "sqlalchemy>=2.0.30,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
flightnotify = "flightnotify.cli:main"

[tool.setuptools.packages.find]
include = ["flightnotify*"]

[tool.setuptools.package-data]
flightnotify = ["web/templates/**/*.html", "web/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008  - FastAPI's Depends() in defaults is the documented idiom.
# RUF012 - SQLAlchemy __table_args__ and label maps are intentionally mutable.
# RUF001/2/3 - user-facing copy deliberately uses en dashes and curly quotes.
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "C408"]

[tool.mypy]
python_version = "3.12"
packages = ["flightnotify"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: opt-in tests that make real provider/Telegram calls and consume quota",
]
filterwarnings = ["error::DeprecationWarning:flightnotify.*"]
