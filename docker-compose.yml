# FlightNotify - local, single-user deployment.
#
#   cp .env.example .env      # then fill in your credentials
#   docker compose up --build
#   open http://127.0.0.1:8000
#
# The app has no authentication. The port is published to 127.0.0.1 only, so it
# is not reachable from your network. Do not change that binding unless you put
# your own authenticated proxy in front of it.

services:
  app:
    build: .
    image: flightnotify:local
    container_name: flightnotify
    restart: unless-stopped
    init: true
    # host-loopback only
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env: inside the container the database lives on the volume
      # and the server must listen on all container interfaces to be reachable
      # through the published loopback port.
      DATABASE_URL: sqlite:////data/flightnotify.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # One worker keeps a single SQLite writer and a single scheduler lease.
      SCHEDULER_ENABLED: "true"
    volumes:
      # Named volume: the database survives `docker compose down` and
      # container recreation. Remove it only with `docker compose down -v`.
      - flightnotify-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  flightnotify-data:
    name: flightnotify-data
