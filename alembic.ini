[alembic]
# Migrations live inside the package so an installed wheel can find them.
# This file exists only for running the `alembic` CLI from a source checkout;
# `flightnotify migrate` resolves the same directory programmatically.
script_location = flightnotify/alembic
prepend_sys_path = .
path_separator = os
# The URL is set at runtime from DATABASE_URL by flightnotify/alembic/env.py;
# this default only exists so `alembic` can be run directly without extra flags.
sqlalchemy.url = sqlite:///data/flightnotify.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
